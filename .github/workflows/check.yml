name: Restock watch

# GitHub's minimum schedule interval is 5 minutes, and runs can drift a few
# minutes late under load. Good enough for a restock race.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test Telegram message instead of a stock check"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: restock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stock and alert
        if: ${{ inputs.test_notify != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIZES: "34"
          REMIND_MINUTES: "120"
        run: python3 check.py

      - name: Send test notification
        if: ${{ inputs.test_notify == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIZES: "34"
        run: python3 check.py --test-notify

      - name: Persist state
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
